
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proposal</title>
<style>
body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#ffdde1;overflow:hidden;font-family:sans-serif}
#c{text-align:center}button{padding:12px 24px;margin:10px;font-size:20px}
#no{position:absolute}
.heart{position:absolute;color:red;animation:f 5s linear infinite}
@keyframes f{from{transform:translateY(100vh)}to{transform:translateY(-10vh)}}
</style></head><body><div id=c><h1>Will You Be Mine? ❤️</h1><button onclick="alert('Yay! ❤️')">Yes</button><button id=no>No</button></div>
<script>
const n=document.getElementById('no');
function mv(){n.style.left=Math.random()*(innerWidth-100)+'px';n.style.top=Math.random()*(innerHeight-50)+'px';}
n.onmouseover=mv;n.onclick=mv;
setInterval(()=>{let h=document.createElement('div');h.className='heart';h.textContent='❤';h.style.left=Math.random()*innerWidth+'px';h.style.fontSize=(10+Math.random()*30)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),5000);},200);
</script></body></html>
