<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Proposal Page ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
    z-index:2;
}

h1{
    color:white;
    font-size:42px;
    margin-bottom:20px;
    text-shadow:0 0 15px red;
}

p{
    color:white;
    font-size:22px;
    margin-bottom:30px;
}

button{
    padding:15px 35px;
    font-size:22px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    transition:.3s;
}

#yes{
    background:#ff0066;
    color:white;
    margin-right:20px;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:white;
    color:black;
    position:absolute;
}

.heart{
    position:absolute;
    color:red;
    animation:float 6s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }

    to{
        transform:translateY(-100px);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>💖 GODHI 💖</h1>

<p>Will You Be Mine Forever? ❤️</p>

<button id="yes">YES ❤️</button>

<button id="no">NO 😅</button>

</div>

<script>

const no=document.getElementById("no");

function moveButton(){

let x=Math.random()*(window.innerWidth-120);

let y=Math.random()*(window.innerHeight-60);

no.style.left=x+"px";

no.style.top=y+"px";

}

no.addEventListener("mouseover",moveButton);

no.addEventListener("click",moveButton);

document.getElementById("yes").onclick=function(){

alert("Yay ❤️ I Love You Forever!");

}
// Floating hearts

function createHeart(){

const heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="❤️";

heart.style.left=Math.random()*window.innerWidth+"px";

heart.style.fontSize=(20+Math.random()*40)+"px";

heart.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

}

setInterval(createHeart,200);

// Sparkle effect

function sparkle(){

const star=document.createElement("div");

star.innerHTML="✨";

star.style.position="absolute";

star.style.left=Math.random()*window.innerWidth+"px";

star.style.top=Math.random()*window.innerHeight+"px";

star.style.fontSize=(10+Math.random()*20)+"px";

star.style.opacity="1";

star.style.transition="1.5s";

document.body.appendChild(star);

setTimeout(()=>{
star.style.opacity="0";
},200);

setTimeout(()=>{
star.remove();
},1800);

}

setInterval(sparkle,400);

// Background click hearts

document.body.addEventListener("click",function(e){

const h=document.createElement("div");

h.innerHTML="💖";

h.style.position="absolute";

h.style.left=e.clientX+"px";

h.style.top=e.clientY+"px";

h.style.fontSize="35px";

h.style.pointerEvents="none";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},1500);

});

// Love message animation

const messages=[
"I Love You ❤️",
"You Are My World 🌍",
"Forever Together 💕",
"My Heart Is Yours 💖",
"Always & Forever ❤️"
];

let index=0;

setInterval(()=>{

document.querySelector("p").innerHTML=messages[index];

index++;

if(index>=messages.length){

index=0;

}

},2500);
// Resize support

window.addEventListener("resize", () => {

    if (parseInt(no.style.left) > window.innerWidth - 120) {
        no.style.left = (window.innerWidth - 140) + "px";
    }

    if (parseInt(no.style.top) > window.innerHeight - 60) {
        no.style.top = (window.innerHeight - 80) + "px";
    }

});

// Randomly move the No button every few seconds
setInterval(() => {

    moveButton();

}, 4000);

// Welcome animation
window.onload = function () {

    setTimeout(() => {

        alert("❤️ Welcome ❤️\n\nThis page was made with love!");

    }, 800);

};

</script>

</body>
</html>
